<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mission 01</title>

<style>

body {
    background:black;
    color:#00ff66;
    font-family:"Courier New", monospace;
    text-align:center;
    padding:40px;
}

.box {
    max-width:600px;
    margin:auto;
    border:2px solid #00ff66;
    padding:30px;
    box-shadow:0 0 20px #00ff66;
}

input {

    background:black;
    border:2px solid #00ff66;
    color:#00ff66;
    padding:12px;
    font-size:18px;
    margin-top:20px;

}

button {

    background:black;
    color:#00ff66;
    border:2px solid #00ff66;
    padding:12px 25px;
    margin-top:20px;
    font-family:monospace;
    font-size:18px;

}

</style>

</head>


<body>


<div class="box">


<h1>
MISSION 01
</h1>


<p>
Erste Sicherheitsprüfung gestartet.
</p>


<p>
Ein Schlüsselwort wurde versteckt.
</p>


<p>
Die Lösung befindet sich in der Startseite.
</p>


<input id="answer" placeholder="Passwort">

<br>


<button onclick="check()">
ÜBERPRÜFEN
</button>


<p id="result"></p>


</div>



<script>


function check(){


let answer = document.getElementById("answer").value;


if(answer.toLowerCase()=="melina"){


document.getElementById("result").innerHTML =
"ACCESS GRANTED<br><br>Mission 01 abgeschlossen.";


}


else{


document.getElementById("result").innerHTML =
"ACCESS DENIED";


}


}


</script>


</body>

</html>
