<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Required</title>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;
    height:100vh;

    background:black;

    color:#00ff66;

    font-family:"Courier New", monospace;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:2s;

}



.container {

    width:90%;
    max-width:600px;

}



.terminal {

    border:2px solid #00ff66;

    padding:30px;

    text-align:center;

    box-shadow:0 0 25px #00ff66;

    transition:2s;

}



h1 {

    font-size:28px;

    margin-bottom:30px;

}



p {

    font-size:18px;

    line-height:1.7;

}



.hint {

    margin-top:30px;

    margin-bottom:15px;

    font-size:32px;

}



input {

    width:80%;

    padding:15px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    text-align:center;

}



button {

    display:block;

    margin:25px auto;

    padding:15px 35px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    cursor:pointer;

}



button:hover {

    opacity:0.8;

}



#result {

    margin-top:25px;

    font-weight:bold;

}



.success {

    color:#00ff66;

}



.error {

    color:red;

}



/* NEUES THEME */


body.unlocked {


    background-image:url("hintergrund.jpg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;


    color:#3b1f2b;

    font-family:Georgia, serif;

    text-shadow:0 1px 3px rgba(255,255,255,0.5);


}



body.unlocked .terminal {


    background:rgba(255,255,255,0.25);

    border:2px solid #ff69b4;

    box-shadow:0 0 30px #ff69b4;


}



body.unlocked button {


    background:rgba(255,255,255,0.35);

    backdrop-filter:blur(5px);

    color:#8b2f5b;

    border-color:#ff69b4;

    box-shadow:0 0 15px rgba(255,105,180,0.5);


}



body.unlocked #login {

    display:none;

}



#welcome {

    display:none;

}



body.unlocked #welcome {

    display:block;

}



</style>

</head>


<body>


<div class="container">


<div class="terminal">



<div id="login">


<h1>
ACCESS REQUIRED
</h1>


<p>
Ein gültiger Zugangscode ist erforderlich.
</p>


<p>
Bitte gib den Schlüssel ein.
</p>



<div class="hint">
👑
</div>



<input id="password" placeholder="CODE EINGEBEN">



<button onclick="checkPassword()">

[ BESTÄTIGEN ]

</button>



<div id="result"></div>


</div>





<div id="welcome">


<h1>
Willkommen Melina ♡
</h1>


<p>
Zugang erfolgreich.
</p>


<p>
Deine Reise beginnt jetzt.
</p>



<button onclick="location.href='mission1.html'">

[ WEITER ]

</button>


</div>



</div>


</div>



<script>


function checkPassword(){


let password =
document.getElementById("password")
.value
.trim()
.toLowerCase();



let result =
document.getElementById("result");



if(password === "prinzessin"){


result.className="success";


result.innerHTML =
"ACCESS GRANTED<br><br>Verbindung wird getrennt...<br><br>Neue Umgebung wird geladen...";



setTimeout(()=>{


let progress = 0;



let loading = setInterval(()=>{


progress += 10;



let blocks =
"█".repeat(progress / 10);



let empty =
"░".repeat(10 - (progress / 10));



result.innerHTML =
"ACCESS GRANTED<br><br>Neue Umgebung wird geladen...<br><br>"
+
blocks
+
empty
+
" "
+
progress
+
"%";



if(progress >= 100){


clearInterval(loading);



setTimeout(()=>{


document.body.classList.add("unlocked");


},1000);



}



},300);



},1500);



}


else{


result.innerHTML="ACCESS DENIED";

result.className="error";


document.getElementById("password").value="";


}


}



</script>


</body>

</html>
