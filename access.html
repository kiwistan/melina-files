<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Required</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin:0;
    height:100vh;

    background:black;

    color:#00ff66;

    font-family:"Courier New", monospace;

    display:flex;
    justify-content:center;
    align-items:center;

}


.container {

    width:90%;
    max-width:600px;

}


.terminal {

    border:2px solid #00ff66;

    padding:30px;

    text-align:center;

    box-shadow:0 0 25px #00ff66;

}


h1 {

    font-size:28px;

    margin-bottom:30px;

}


p {

    font-size:18px;

    line-height:1.7;

}


.hint {

    margin-top:30px;

    margin-bottom:15px;

    font-size:32px;

}


input {

    width:80%;

    padding:15px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    text-align:center;

}


input::placeholder {

    color:#00ff66;

    opacity:0.7;

}


button {

    display:block;

    margin:25px auto 0;

    padding:15px 35px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    cursor:pointer;

}


button:hover {

    background:#00ff66;

    color:black;

}


#result {

    margin-top:25px;

    font-size:20px;

}


</style>

</head>


<body>


<div class="container">


<div class="terminal">


<h1>
ACCESS REQUIRED
</h1>


<p>
Ein gültiger Zugangscode ist erforderlich.
</p>


<p>
Bitte gib den Schlüssel ein.
</p>


<div class="hint">
👑
</div>


<input id="password" placeholder="CODE EINGEBEN">


<button onclick="checkPassword()">

[ BESTÄTIGEN ]

</button>


<div id="result"></div>


</div>


</div>



<script>


function checkPassword(){


let password = document
.getElementById("password")
.value
.trim()
.toLowerCase();



let correctPassword = "prinzessin";



if(password === correctPassword){


document.getElementById("result").innerHTML =
"ACCESS GRANTED";


setTimeout(()=>{


location.href="mission1.html";


},2000);


}


else{


document.getElementById("result").innerHTML =
"ACCESS DENIED";


document.getElementById("password").value="";


}


}


</script>



</body>

</html>
