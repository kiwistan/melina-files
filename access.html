<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Required</title>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;
    height:100vh;

    background:black;

    color:#00ff66;

    font-family:"Courier New", monospace;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:2s;

}



.container {

    width:90%;
    max-width:600px;

}



.terminal {

    border:2px solid #00ff66;

    padding:30px;

    text-align:center;

    box-shadow:0 0 25px #00ff66;

    transition:2s;

}



h1 {

    font-size:28px;

    margin-bottom:30px;

}



p {

    font-size:18px;

    line-height:1.7;

}



.hint {

    font-size:32px;

    margin:30px 0 15px;

}



input {

    width:80%;

    padding:15px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    text-align:center;

}



button {

    display:block;

    margin:25px auto;

    padding:15px 35px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    cursor:pointer;

}



#result {

    margin-top:25px;

    font-weight:bold;

}



.success {

    color:#00ff66;

}


.error {

    color:red;

}



/* NEUES THEME */


body.unlocked {

    background-image:url("hintergrund.jpg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    color:white;

    font-family:Georgia, serif;

}



body.unlocked .terminal {

    background:rgba(0,0,0,0.35);

    border:2px solid #ff69b4;

    box-shadow:0 0 30px #ff69b4;

}



body.unlocked h1,
body.unlocked p {

    color:white;

}



body.unlocked button {

    background:rgba(0,0,0,0.25);

    color:#00ff66;

    border-color:#00ff66;

    box-shadow:0 0 15px rgba(0,255,102,0.5);

}



#welcome {

    display:none;

}


#challenge {

    display:none;

}



body.challenge-mode #welcome {

    display:none;

}



body.challenge-mode #challenge {

    display:block;

}



.welcome-title {

    font-size:42px;

    margin-bottom:60px;

}



.challenge-title {

    font-size:34px;

}



</style>

</head>


<body>


<div class="container">


<div class="terminal">



<div id="login">


<h1>
ACCESS REQUIRED
</h1>


<p>
Ein gültiger Zugangscode ist erforderlich.
</p>


<p>
Bitte gib den Schlüssel ein.
</p>



<div class="hint">
👑
</div>



<input id="password" placeholder="CODE EINGEBEN">



<button onclick="checkPassword()">

[ BESTÄTIGEN ]

</button>



<div id="result"></div>


</div>





<div id="welcome">


<h1 class="welcome-title">
Willkommen Melina ♡
</h1>


<button onclick="startChallenge()">

[ WEITER ]

</button>


</div>





<div id="challenge">


<h1 class="challenge-title">
Deine Herausforderung
</h1>


<p>
8 Ziffern wurden verborgen.
</p>


<p>
Löse die Rätsel und finde jede einzelne von ihnen.
</p>


<p>
Merke sie dir gut – du wirst sie am Ende brauchen.
</p>


<p>
Viel Erfolg, Melina ♡
</p>



<button onclick="location.href='mission1.html'">

[ ERSTES RÄTSEL STARTEN ]

</button>


</div>



</div>


</div>



<script>


function checkPassword(){


let password =
document.getElementById("password")
.value
.trim()
.toLowerCase();



let result =
document.getElementById("result");



if(password === "prinzessin"){


result.className="success";


result.innerHTML =
"ACCESS GRANTED<br><br>Neue Umgebung wird geladen...";



setTimeout(()=>{


let progress=0;


let loading=setInterval(()=>{


progress+=10;


result.innerHTML =
"Neue Umgebung wird geladen...<br><br>"
+
"█".repeat(progress/10)
+
"░".repeat(10-progress/10)
+
" "
+
progress
+
"%";



if(progress>=100){


clearInterval(loading);


document.body.classList.add("unlocked");


}



},300);



},1000);



}


else{


result.innerHTML="ACCESS DENIED";

result.className="error";


document.getElementById("password").value="";


}


}




function startChallenge(){

document.body.classList.add("challenge-mode");

}



</script>


</body>

</html>
