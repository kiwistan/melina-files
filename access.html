<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Access Required</title>


<style>

* {
    box-sizing:border-box;
}


body {

    margin:0;
    height:100vh;

    background:black;

    color:#00ff66;

    font-family:"Courier New", monospace;

    display:flex;
    justify-content:center;
    align-items:center;

    transition:2s;

}



.container {

    width:90%;
    max-width:600px;

}



.terminal {

    border:2px solid #00ff66;

    padding:30px;

    text-align:center;

    box-shadow:0 0 25px #00ff66;

    transition:2s;

}



h1 {

    font-size:28px;

    margin-bottom:30px;

}



p {

    font-size:18px;

    line-height:1.7;

}



.hint {

    margin-top:30px;

    margin-bottom:15px;

    font-size:32px;

}



input {

    width:80%;

    padding:15px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    text-align:center;

}



button {

    display:block;

    margin:25px auto;

    padding:15px 35px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    cursor:pointer;

}



#result {

    margin-top:25px;

    font-weight:bold;

}



.success {

    color:#00ff66;

}


.error {

    color:red;

}



/* Neues Theme */


body.unlocked {


    background-image:url("hintergrund.jpg");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    color:white;

    font-family:Georgia, serif;


}



body.unlocked .terminal {


    background:rgba(0,0,0,0.45);

    border:2px solid #ff69b4;

    box-shadow:0 0 30px #ff69b4;


}



body.unlocked button {


    background:rgba(0,0,0,0.4);

    color:#ff69b4;

    border-color:#ff69b4;


}



body.unlocked input {

    display:none;

}



#login {

    display:block;

}



#welcome {

    display:none;

}



body.unlocked #login {

    display:none;

}



body.unlocked #welcome {

    display:block;

}



</style>

</head>


<body>


<div class="container">


<div class="terminal">


<div id="login">


<h1>
ACCESS REQUIRED
</h1>


<p>
Ein gültiger Zugangscode ist erforderlich.
</p>


<p>
Bitte gib den Schlüssel ein.
</p>


<div class="hint">
👑
</div>


<input id="password" placeholder="CODE EINGEBEN">



<button onclick="checkPassword()">

[ BESTÄTIGEN ]

</button>


<div id="result"></div>


</div>





<div id="welcome">


<h1>
Willkommen Melina ♡
</h1>


<p>
Zugang erfolgreich.
</p>


<p>
Deine Reise beginnt jetzt.
</p>



<button onclick="location.href='mission1.html'">

[ WEITER ]

</button>


</div>


</div>


</div>



<script>


function checkPassword(){


let password =
document.getElementById("password")
.value
.trim()
.toLowerCase();



let result =
document.getElementById("result");



if(password === "prinzessin"){


result.innerHTML="ACCESS GRANTED";

result.className="success";



setTimeout(()=>{


document.body.classList.add("unlocked");


},2000);



}

else{


result.innerHTML="ACCESS DENIED";

result.className="error";


document.getElementById("password").value="";


}


}



</script>


</body>

</html>
