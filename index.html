<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Activation</title>


<style>

* {
    box-sizing: border-box;
}


body {

    margin:0;
    height:100vh;

    background:black;

    color:#00ff66;

    font-family:"Courier New", monospace;

    display:flex;
    justify-content:center;
    align-items:center;

}


.container {

    width:90%;
    max-width:600px;

}


.terminal {

    border:2px solid #00ff66;

    padding:30px;

    text-align:center;

    box-shadow:0 0 25px #00ff66;

}



h1 {

    font-size:28px;

}



p {

    font-size:18px;

    line-height:1.6;

}



button {

    margin-top:30px;

    padding:15px 35px;

    background:black;

    color:#00ff66;

    border:2px solid #00ff66;

    font-family:"Courier New", monospace;

    font-size:18px;

    cursor:pointer;

}



button:hover {

    background:#00ff66;

    color:black;

}



.hidden {

    display:none;

}



#boot {

    text-align:left;

    margin-top:20px;

}



.cursor {

    animation:blink 1s infinite;

}


@keyframes blink {

    50% {
        opacity:0;
    }

}



</style>


</head>



<body>


<div class="container">


<div class="terminal">


<h1>
SYSTEM OFFLINE
</h1>


<p>
Audio-System nicht aktiviert.
</p>


<p>
Initialisierung erforderlich.
</p>



<button onclick="activateSystem()">

[ ACTIVATE SYSTEM ]

</button>



<div id="boot" class="hidden">

<p id="text"></p>

</div>



</div>


</div>



<script>


// Audio erzeugen

let audioContext;



function playSound(){


if(!audioContext) return;


let oscillator = audioContext.createOscillator();

let gain = audioContext.createGain();



oscillator.type="square";

oscillator.frequency.value=700;


gain.gain.value=0.03;



oscillator.connect(gain);

gain.connect(audioContext.destination);



oscillator.start();


oscillator.stop(audioContext.currentTime + 0.05);


}




const lines=[

"SYSTEM BOOTING...",

"",

"Identität wird geprüft...",

"",

"Benutzer erkannt:",

"MELINA",

"",

"Verbindung wird hergestellt...",

"Sicherheitsprotokolle werden geladen...",

"",

"System bereit."

];



let line=0;

let char=0;



function typeText(){


if(line < lines.length){


if(char < lines[line].length){


let text=document.getElementById("text");


text.innerHTML += lines[line].charAt(char);


playSound();


char++;


setTimeout(typeText,50);


}

else{


document.getElementById("text").innerHTML += "<br>";


line++;

char=0;


setTimeout(typeText,700);


}


}


else{


setTimeout(()=>{


document.getElementById("text").innerHTML +=
"<br><br>[ ACCESS GRANTED ]";


setTimeout(()=>{


document.getElementById("text").innerHTML +=
"<br><br><button onclick=\"location.href='mission1.html'\">[ MISSION STARTEN ]</button>";


},1000);


},1000);


}


}




function activateSystem(){


audioContext = new AudioContext();


document.querySelector("button").style.display="none";


document.querySelector("h1").innerHTML="SYSTEM ONLINE";


document.querySelector("p").style.display="none";


document.getElementById("boot").classList.remove("hidden");


typeText();


}


</script>


</body>

</html>
