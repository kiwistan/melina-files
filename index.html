<!DOCTYPE html>
<html lang="de">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>System Booting</title>

<style>

* {
    box-sizing: border-box;
}


body {

    margin: 0;
    height: 100vh;

    background: black;

    color: #00ff66;

    font-family: "Courier New", monospace;

    display: flex;
    justify-content: center;
    align-items: center;

}


.container {

    width: 90%;
    max-width: 600px;

}


.terminal {

    border: 2px solid #00ff66;

    padding: 30px;

    box-shadow: 0 0 25px #00ff66;

}


h1 {

    text-align: center;

    font-size: 28px;

    margin-bottom: 30px;

}


#text {

    font-size: 18px;

    line-height: 1.7;

    min-height: 80px;

}


button {

    display: block;

    margin: 30px auto 0;

    padding: 15px 35px;

    background: black;

    color: #00ff66;

    border: 2px solid #00ff66;

    font-family: "Courier New", monospace;

    font-size: 18px;

    cursor: pointer;

}


button:hover {

    background: #00ff66;

    color: black;

}


</style>

</head>


<body>


<div class="container">


<div class="terminal">


<h1>
SYSTEM BOOTING...
</h1>


<div id="text"></div>


</div>


</div>



<script>


const lines = [

"Identität wird geprüft...",

"",

"Benutzer erkannt:",

"MELINA ♡",

"",

"Verbindung wird hergestellt...",

"Sicherheitsprotokolle werden geladen...",

"Unbekannter Zugriffspunkt gefunden...",

"",

"System bereit."

];



let line = 0;

let char = 0;



function typeText(){


if(line < lines.length){


if(char < lines[line].length){


document.getElementById("text").innerHTML += 
lines[line].charAt(char);


char++;


setTimeout(typeText,50);


}


else{


document.getElementById("text").innerHTML += "<br>";


line++;

char = 0;


setTimeout(typeText,700);


}


}


else{


setTimeout(()=>{


document.getElementById("text").innerHTML +=
`
<br>
<button onclick="location.href='access.html'">
[ WEITER ]
</button>
`;


},1000);


}


}



typeText();


</script>


</body>

</html>
